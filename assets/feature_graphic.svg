<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2c5282;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b6cb0;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGradient)"/>

  <!-- Decorative Background Elements -->
  <circle cx="900" cy="80" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="950" cy="400" r="200" fill="#ffffff" opacity="0.03"/>
  <circle cx="100" cy="450" r="120" fill="#ffffff" opacity="0.03"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1024" y2="100" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1024" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1024" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1024" y2="400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Left Side: Owl Icon -->
  <g transform="translate(100, 75)" filter="url(#shadow)">
    <!-- Outer white circle border -->
    <circle cx="175" cy="175" r="175" fill="#f0f0f0" stroke="#cccccc" stroke-width="3"/>

    <!-- Dark gray owl body -->
    <circle cx="175" cy="175" r="160" fill="#4a4a4a"/>

    <!-- White "beak" / center divider shape -->
    <path d="M175,45 Q155,120 175,180 Q195,120 175,45" fill="#f0f0f0"/>
    <path d="M175,180 Q165,220 175,320 Q185,220 175,180" fill="#f0f0f0"/>

    <!-- Left Eye - Colorful ring segments (like pie chart) -->
    <g transform="translate(95, 130)">
      <!-- Eye background ring -->
      <circle cx="40" cy="40" r="50" fill="none" stroke="#e0e0e0" stroke-width="25"/>

      <!-- Orange segment (top-left) -->
      <path d="M40,40 L40,-10 A50,50 0 0,1 75,10 Z" fill="#e86830"/>

      <!-- Pink/Magenta segment (top-right) -->
      <path d="M40,40 L75,10 A50,50 0 0,1 90,40 Z" fill="#c44b99"/>

      <!-- Purple segment (right) -->
      <path d="M40,40 L90,40 A50,50 0 0,1 75,75 Z" fill="#8b4b9e"/>

      <!-- Blue segment (bottom-right) -->
      <path d="M40,40 L75,75 A50,50 0 0,1 40,90 Z" fill="#4a6fa5"/>

      <!-- Teal segment (bottom) -->
      <path d="M40,40 L40,90 A50,50 0 0,1 5,75 Z" fill="#5a8a98"/>

      <!-- Purple-blue segment (bottom-left) -->
      <path d="M40,40 L5,75 A50,50 0 0,1 -10,40 Z" fill="#6b5b95"/>

      <!-- Blue segment (left) -->
      <path d="M40,40 L-10,40 A50,50 0 0,1 5,5 Z" fill="#4169a4"/>

      <!-- Orange segment (top) -->
      <path d="M40,40 L5,5 A50,50 0 0,1 40,-10 Z" fill="#e07850"/>

      <!-- Inner black pupil -->
      <circle cx="40" cy="40" r="18" fill="#1a1a1a"/>
      <circle cx="45" cy="35" r="5" fill="#333333"/>
    </g>

    <!-- Right Eye - Colorful ring segments (mirrored) -->
    <g transform="translate(215, 130)">
      <!-- Pink/Magenta segment (top-left) -->
      <path d="M40,40 L40,-10 A50,50 0 0,1 75,10 Z" fill="#c44b99"/>

      <!-- Orange segment (top-right) -->
      <path d="M40,40 L75,10 A50,50 0 0,1 90,40 Z" fill="#e86830"/>

      <!-- Orange segment (right) -->
      <path d="M40,40 L90,40 A50,50 0 0,1 75,75 Z" fill="#e07850"/>

      <!-- Teal segment (bottom-right) -->
      <path d="M40,40 L75,75 A50,50 0 0,1 40,90 Z" fill="#5a8a98"/>

      <!-- Blue segment (bottom) -->
      <path d="M40,40 L40,90 A50,50 0 0,1 5,75 Z" fill="#4a6fa5"/>

      <!-- Purple segment (bottom-left) -->
      <path d="M40,40 L5,75 A50,50 0 0,1 -10,40 Z" fill="#8b4b9e"/>

      <!-- Purple-blue segment (left) -->
      <path d="M40,40 L-10,40 A50,50 0 0,1 5,5 Z" fill="#6b5b95"/>

      <!-- Pink segment (top-left) -->
      <path d="M40,40 L5,5 A50,50 0 0,1 40,-10 Z" fill="#c44b99"/>

      <!-- Inner black pupil -->
      <circle cx="40" cy="40" r="18" fill="#1a1a1a"/>
      <circle cx="35" cy="35" r="5" fill="#333333"/>
    </g>
  </g>

  <!-- Right Side: Text Content -->
  <g transform="translate(420, 0)">
    <!-- App Name -->
    <text x="0" y="160" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">MoneyLupe</text>

    <!-- Tagline -->
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="28" fill="#90cdf4">Analyze. Organize. Simplify.</text>

    <!-- Divider Line -->
    <rect x="0" y="245" width="120" height="4" rx="2" fill="url(#accentGradient)"/>

    <!-- Feature Points -->
    <g transform="translate(0, 280)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="12" fill="#48bb78"/>
        <text x="12" y="17" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
        <text x="35" y="18" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">100% Offline &amp; Privat</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(0, 50)">
        <circle cx="12" cy="12" r="12" fill="#48bb78"/>
        <text x="12" y="17" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
        <text x="35" y="18" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">PDF, CSV &amp; Excel Import</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 100)">
        <circle cx="12" cy="12" r="12" fill="#48bb78"/>
        <text x="12" y="17" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
        <text x="35" y="18" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">26+ Deutsche Banken</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="485" width="1024" height="15" fill="url(#accentGradient)"/>
</svg>
