<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MoneyLupe — Mobile UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #E2E8F0; font-family: 'Roboto', system-ui, -apple-system, sans-serif; color: #0F172A; min-height: 100vh; transition: background 240ms; }
  body[data-canvas="dark"] { background: #0B1220; color: #E2E8F0; }
  .page { padding: 40px 32px 80px; }
  .hdr { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .title { font-weight: 700; font-size: 28px; letter-spacing: -.01em; margin: 0; }
  body[data-canvas="dark"] .title { color: #F1F5F9; }
  .sub { color: #475569; font-size: 14px; margin: 4px 0 0; max-width: 540px; line-height: 1.5; }
  body[data-canvas="dark"] .sub { color: #94A3B8; }
  .legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: #64748B; }
  .legend b { color: #0F172A; font-weight: 600; }
  body[data-canvas="dark"] .legend, body[data-canvas="dark"] .legend b { color: #94A3B8; }
  body[data-canvas="dark"] .legend b { color: #E2E8F0; }
  .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
  .group { display: flex; gap: 6px; padding: 4px; background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; }
  body[data-canvas="dark"] .group { background: #111827; border-color: #1F2937; }
  .tab { padding: 8px 14px; border-radius: 8px; background: transparent; border: 0; font-size: 13px; font-weight: 500; color: #475569; cursor: pointer; transition: all 180ms; font-family: inherit; }
  body[data-canvas="dark"] .tab { color: #94A3B8; }
  .tab:hover { color: #0F172A; }
  body[data-canvas="dark"] .tab:hover { color: #F1F5F9; }
  .tab.active { background: #0F2A44; color: #fff; }
  body[data-canvas="dark"] .tab.active { background: #2563EB; color: #fff; }
  .group-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #94A3B8; padding: 0 6px; align-self: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(414px, 1fr)); gap: 36px 28px; max-width: 1800px; }
  .screen-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .screen-label { font-size: 12px; font-weight: 600; color: #475569; letter-spacing: .02em; }
  body[data-canvas="dark"] .screen-label { color: #94A3B8; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1800px; }
  .section-title { font-size: 18px; font-weight: 700; letter-spacing: -.005em; margin: 36px 0 16px; padding-bottom: 8px; border-bottom: 1px solid #CBD5E1; }
  body[data-canvas="dark"] .section-title { color: #F1F5F9; border-color: #1F2937; }
  #root { min-height: 100vh; }
</style>
</head>
<body data-canvas="light">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="./Icons.jsx"></script>
<script type="text/babel" src="./Primitives.jsx"></script>
<script type="text/babel" src="./ScreensA.jsx"></script>
<script type="text/babel" src="./ScreensB.jsx"></script>
<script type="text/babel" src="./ScreensC.jsx"></script>
<script type="text/babel" src="./tweaks-panel.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showSearchInModal": true,
  "highlightContrast": "subtle",
  "showAddDemoData": false
}/*EDITMODE-END*/;

// Demo data for the "Manage Categories" screen — flips between empty state
// and populated state via the showAddDemoData tweak.
const DEMO_CUSTOMS = [
  { name: "Coffee runs",  icon: "utensils", color: "#F97316" },
  { name: "Side hustle",  icon: "wallet",   color: "#10B981" },
  { name: "Gym",          icon: "heart",    color: "#EF4444" },
];

// Existing primary screens (light mode only — that's what shipped)
const APP_SCREENS = [
  { id: "home",      label: "01 Home",      Comp: () => <MLHomeScreen     onTab={()=>{}}/> },
  { id: "activity",  label: "02 Activity",  Comp: () => <MLActivityScreen onTab={()=>{}}/> },
  { id: "spending",  label: "03 Spending",  Comp: () => <MLSpendingScreen onTab={()=>{}}/> },
  { id: "merchants", label: "04 Merchants", Comp: () => <MLMerchantsScreen onTab={()=>{}}/> },
  { id: "settings",  label: "05 Settings",  Comp: () => <MLSettingsScreen onTab={()=>{}}/> },
];

// New category screens — built in both themes
function CatScreens(theme, tweaks) {
  const customs = tweaks.showAddDemoData ? DEMO_CUSTOMS : [];
  return [
    {
      id: `manage-${theme}`,
      label: `06 Manage Categories · ${theme}`,
      Comp: () => <MLManageCategoriesScreen theme={theme} customs={customs}/>,
    },
    {
      id: `change-${theme}`,
      label: `07 Change Category · ${theme}`,
      // Place the modal over a dim "Activity" backdrop for context
      Comp: () => (
        <>
          <MLActivityBackdrop theme={theme}/>
          <MLChangeCategorySheet
            theme={theme}
            showSearch={tweaks.showSearchInModal}
            highlightContrast={tweaks.highlightContrast}/>
        </>
      ),
    },
    {
      id: `add-${theme}`,
      label: `08 Add Category · ${theme}`,
      Comp: () => (
        <>
          <MLActivityBackdrop theme={theme}/>
          <MLAddCategorySheet theme={theme}/>
        </>
      ),
    },
  ];
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [view, setView] = React.useState(() => localStorage.getItem("ml_kit_view") || "all");

  React.useEffect(() => { localStorage.setItem("ml_kit_view", view); }, [view]);

  // Sync canvas background
  React.useEffect(() => {
    const dark = view === "dark" || view === "categories-dark";
    document.body.dataset.canvas = dark ? "dark" : "light";
  }, [view]);

  const renderApp = view === "all" || view === "app";
  const renderCatLight = view === "all" || view === "categories" || view === "categories-light";
  const renderCatDark  = view === "all" || view === "categories-dark" || view === "dark";

  return (
    <div className="page">
      <div className="hdr">
        <div>
          <h1 className="title">MoneyLupe — Mobile UI Kit</h1>
          <p className="sub">Hi-fi recreation of the MoneyLupe Android/iOS app. Five primary screens plus the category-management flow (Change · Add · Manage), in both light and dark themes.</p>
        </div>
        <div className="legend">
          <span><b>{APP_SCREENS.length + 6}</b> screens</span>
          <span><b>390 × 800</b> viewport</span>
          <span><b>Roboto</b> · Roboto Mono</span>
        </div>
      </div>

      <div className="controls">
        <div className="group">
          <span className="group-label">View</span>
          <button className={"tab " + (view === "all" ? "active" : "")} onClick={() => setView("all")}>Everything</button>
          <button className={"tab " + (view === "app" ? "active" : "")} onClick={() => setView("app")}>Primary 5</button>
          <button className={"tab " + (view === "categories" ? "active" : "")} onClick={() => setView("categories")}>Categories · light</button>
          <button className={"tab " + (view === "categories-dark" ? "active" : "")} onClick={() => setView("categories-dark")}>Categories · dark</button>
        </div>
      </div>

      {renderApp && (
        <>
          <div className="section-title">Primary screens</div>
          <div className="grid">
            {APP_SCREENS.map(s => (
              <div className="screen-wrap" key={s.id}>
                <MLPhone label={s.label}><s.Comp/></MLPhone>
                <div className="screen-label">{s.label}</div>
              </div>
            ))}
          </div>
        </>
      )}

      {renderCatLight && (
        <>
          <div className="section-title">Category management — Light</div>
          <div className="grid">
            {CatScreens("light", tweaks).map(s => (
              <div className="screen-wrap" key={s.id}>
                <MLPhoneT theme="light" label={s.label}><s.Comp/></MLPhoneT>
                <div className="screen-label">{s.label}</div>
              </div>
            ))}
          </div>
        </>
      )}

      {renderCatDark && (
        <>
          <div className="section-title">Category management — Dark</div>
          <div className="grid">
            {CatScreens("dark", tweaks).map(s => (
              <div className="screen-wrap" key={s.id}>
                <MLPhoneT theme="dark" label={s.label}><s.Comp/></MLPhoneT>
                <div className="screen-label">{s.label}</div>
              </div>
            ))}
          </div>
        </>
      )}

      <TweaksPanel title="Category flow tweaks">
        <TweakSection label="Change Category modal">
          <TweakToggle
            label="Search bar"
            value={tweaks.showSearchInModal}
            onChange={(v) => setTweak("showSearchInModal", v)}/>
          <TweakRadio
            label="Selected highlight"
            options={[{label: "Subtle", value: "subtle"}, {label: "Tinted", value: "strong"}]}
            value={tweaks.highlightContrast}
            onChange={(v) => setTweak("highlightContrast", v)}/>
        </TweakSection>
        <TweakSection label="Manage Categories screen">
          <TweakToggle
            label="Show demo custom categories"
            value={tweaks.showAddDemoData}
            onChange={(v) => setTweak("showAddDemoData", v)}/>
        </TweakSection>
      </TweaksPanel>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
