<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#0F2A44;font-family:var(--ml-font-sans);color:#fff}
.wrap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center}
.title{font:700 20px var(--ml-font-sans);letter-spacing:-.01em}
.ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#E5E7EB}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pair{display:flex;gap:24px;margin-top:4px}
.m{display:flex;flex-direction:column;gap:2px}
.lbl{font-size:11px;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.val{font:600 18px var(--ml-font-mono);font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap">
<div class="top"><div class="title">MoneyLupe</div>
  <div style="display:flex;gap:4px"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09c.73 0 1.37-.43 1.65-1.09z"/></svg></div></div>
</div>
<div class="pair">
  <div class="m"><div class="lbl">Income</div><div class="val" style="color:#34D399">+€4,820.00</div></div>
  <div class="m"><div class="lbl">Expenses</div><div class="val" style="color:#FCA5A5">−€1,342.18</div></div>
</div>
</div></body></html>
