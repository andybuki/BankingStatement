<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:var(--ml-font-sans)}
.wrap{padding:20px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.it{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{background:#DBEAFE;border:1.5px solid #2563EB;width:72px;height:72px}
.r-xs{border-radius:6px}.r-sm{border-radius:8px}.r-md{border-radius:12px}.r-lg{border-radius:16px}.r-xl{border-radius:24px}.r-pill{border-radius:999px}
.name{font-size:12px;color:var(--ml-ink);font-weight:600}
.lbl{font-size:11px;color:var(--ml-muted);font-family:var(--ml-font-mono)}
</style></head><body><div class="wrap">
<div class="it"><div class="box r-xs"></div><div class="name">xs</div><div class="lbl">6px · chips</div></div>
<div class="it"><div class="box r-sm"></div><div class="name">sm</div><div class="lbl">8px · pills</div></div>
<div class="it"><div class="box r-md"></div><div class="name">md</div><div class="lbl">12px · inputs</div></div>
<div class="it"><div class="box r-lg"></div><div class="name">lg</div><div class="lbl">16px · cards</div></div>
<div class="it"><div class="box r-xl"></div><div class="name">xl</div><div class="lbl">24px · hero</div></div>
<div class="it"><div class="box r-pill" style="width:120px;height:44px"></div><div class="name">pill</div><div class="lbl">999px · FAB</div></div>
</div></body></html>
