<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:var(--ml-font-sans);color:var(--ml-ink)}
.wrap{padding:16px;display:grid;grid-template-columns:1.3fr 1.3fr .9fr;gap:10px}
.tile{border-radius:16px;padding:18px 18px;display:flex;align-items:center;gap:14px;min-height:96px;position:relative;overflow:hidden}
.light{background:#F8FAFC;border:1px solid #E5E7EB}
.navy{background:#0F2A44;color:#fff}
.mark{background:#fff;border:1px solid #E5E7EB;justify-content:center}
.owl{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:14px}
.owl.on-light{background:#0F2A44}
.owl.on-navy{background:rgba(255,255,255,0.08)}
.owl img{width:40px;height:auto;display:block}
.mark .owl-big img{width:72px;height:auto;display:block}
.word{font:700 24px/1 var(--ml-font-sans);letter-spacing:-0.015em}
.word.light{color:#0F172A}.word.dark{color:#fff}
.tag{margin-top:4px;font:500 12px var(--ml-font-sans);letter-spacing:0}
.tag.light{color:#475569}.tag.dark{color:#94A3B8}
.stamp{position:absolute;top:10px;right:12px;font:600 9px var(--ml-font-mono);text-transform:uppercase;letter-spacing:.1em}
.stamp.light{color:#94A3B8}.stamp.dark{color:#64748B}
</style></head><body><div class="wrap">

<div class="tile light">
  <span class="stamp light">Primary · on light</span>
  <div class="owl on-light"><img src="../assets/owl_mark.svg" alt="MoneyLupe owl"/></div>
  <div>
    <div class="word light">MoneyLupe</div>
    <div class="tag light">Analyze. Organize. Simplify.</div>
  </div>
</div>

<div class="tile navy">
  <span class="stamp dark">On navy</span>
  <div class="owl on-navy"><img src="../assets/owl_mark.svg" alt="MoneyLupe owl"/></div>
  <div>
    <div class="word dark">MoneyLupe</div>
    <div class="tag dark">Analyze. Organize. Simplify.</div>
  </div>
</div>

<div class="tile mark">
  <span class="stamp light">Mark only</span>
  <div class="owl-big"><img src="../assets/owl_mark.svg" alt="MoneyLupe owl mark"/></div>
</div>

</div></body></html>
