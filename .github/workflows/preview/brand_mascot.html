<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#F1F5F9;font-family:var(--ml-font-sans)}
.wrap{padding:20px;display:flex;gap:16px;align-items:center}
.owl{width:140px;height:120px;background:#fff;border-radius:24px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm)}
.owl img{width:110px;height:auto}
.owl.navy{background:#0F2A44}
.notes{display:flex;flex-direction:column;gap:6px}
.t{font:600 14px var(--ml-font-sans);color:var(--ml-ink);margin:0}
.p{font-size:12px;color:var(--ml-text);margin:0;line-height:1.45;max-width:360px}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.c{font-family:var(--ml-font-mono);font-size:10px;background:#fff;border:1px solid #E5E7EB;padding:2px 6px;border-radius:6px;color:var(--ml-text)}
</style></head><body><div class="wrap">
<div class="owl"><img src="../assets/owl_mark.svg" alt="owl"></div>
<div class="owl navy"><img src="../assets/owl_mark.svg" alt="owl"></div>
<div class="notes">
  <p class="t">Sova — the MoneyLupe owl</p>
  <p class="p">Converted from the app's Android vector (sova.xml). Multi-colored spoke eyes on a near-black body. Use at 24–140px. Never recolor the mascot.</p>
  <div class="chips"><span class="c">#3D3B3C</span><span class="c">#EA5F2D</span><span class="c">#942560</span><span class="c">#703178</span><span class="c">#3E4C93</span><span class="c">#306E8C</span></div>
</div>
</div></body></html>
