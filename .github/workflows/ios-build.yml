name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      deploy_testflight:
        description: 'Deploy to TestFlight'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: macos-14  # macOS Sonoma with Xcode 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build iOS Framework (Simulator)
      run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

    - name: Build iOS App (Simulator)
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj \
          -scheme iosApp \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
          -configuration Debug \
          clean build

    - name: Upload Simulator Build
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-build
        path: iosApp/build/Build/Products/Debug-iphonesimulator/
        retention-days: 7

  build-device:
    runs-on: macos-14
    if: github.event.inputs.deploy_testflight == 'true' || github.ref == 'refs/heads/main'
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build iOS Framework (Device)
      run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

    - name: Install Apple Certificate
      if: github.event.inputs.deploy_testflight == 'true'
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Create variables
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Import certificate from secrets
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate to keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Install Provisioning Profile
      if: github.event.inputs.deploy_testflight == 'true'
      env:
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      run: |
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

    - name: Build iOS App (Device - Unsigned)
      if: github.event.inputs.deploy_testflight != 'true'
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj \
          -scheme iosApp \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          clean build

    - name: Archive iOS App
      if: github.event.inputs.deploy_testflight == 'true'
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj \
          -scheme iosApp \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -archivePath $RUNNER_TEMP/BankingStatement.xcarchive \
          archive

    - name: Export IPA
      if: github.event.inputs.deploy_testflight == 'true'
      run: |
        cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadSymbols</key>
            <true/>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/BankingStatement.xcarchive \
          -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
          -exportPath $RUNNER_TEMP/export

    - name: Upload to TestFlight
      if: github.event.inputs.deploy_testflight == 'true'
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      run: |
        xcrun altool --upload-app \
          --type ios \
          --file "$RUNNER_TEMP/export/BankingStatement.ipa" \
          --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
          --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

    - name: Upload Device Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-device-build
        path: |
          iosApp/build/Build/Products/Release-iphoneos/
          ${{ runner.temp }}/export/*.ipa
        retention-days: 14

    - name: Clean up keychain
      if: always() && github.event.inputs.deploy_testflight == 'true'
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
