<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:var(--ml-font-sans);color:var(--ml-ink)}
.wrap{padding:20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;min-width:100px}
.chip{height:52px;border-radius:10px;border:1px solid rgba(15,23,42,.08)}
.name{font-size:13px;color:var(--ml-ink);font-weight:600}
.hex{font-family:var(--ml-font-mono);font-size:11px;color:var(--ml-text)}
</style></head><body><div class="wrap">
<div class="row">
  <div class="sw"><div class="chip" style="background:#0F172A"></div><div class="name">Ink</div><div class="hex">#0F172A</div></div>
  <div class="sw"><div class="chip" style="background:#1E293B"></div><div class="name">Ink-2</div><div class="hex">#1E293B</div></div>
  <div class="sw"><div class="chip" style="background:#475569"></div><div class="name">Text</div><div class="hex">#475569</div></div>
  <div class="sw"><div class="chip" style="background:#64748B"></div><div class="name">Text-2</div><div class="hex">#64748B</div></div>
  <div class="sw"><div class="chip" style="background:#94A3B8"></div><div class="name">Muted</div><div class="hex">#94A3B8</div></div>
  <div class="sw"><div class="chip" style="background:#CBD5E1"></div><div class="name">Border-2</div><div class="hex">#CBD5E1</div></div>
  <div class="sw"><div class="chip" style="background:#E5E7EB"></div><div class="name">Border</div><div class="hex">#E5E7EB</div></div>
  <div class="sw"><div class="chip" style="background:#F1F5F9"></div><div class="name">Surface-3</div><div class="hex">#F1F5F9</div></div>
  <div class="sw"><div class="chip" style="background:#F8FAFC"></div><div class="name">Surface-2</div><div class="hex">#F8FAFC</div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="name">Surface</div><div class="hex">#FFFFFF</div></div>
</div></div></body></html>
