<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:var(--ml-font-sans);color:var(--ml-ink)}
.wrap{padding:16px}
.list{display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:var(--sh-xs);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid #F1F5F9}
.row:first-child{border-top:0}
.ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
.main{flex:1;min-width:0}
.t{font:600 14px var(--ml-font-sans);color:var(--ml-ink)}
.s{font-size:12px;color:var(--ml-muted);margin-top:2px}
.amt{font-family:var(--ml-font-mono);font-weight:500;font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap">
<div class="list">
  <div class="row"><div class="ic" style="background:#22C55E">R</div>
    <div class="main"><div class="t">REWE SAGT DANKE</div><div class="s">Supermarket · 22 Apr</div></div>
    <div class="amt" style="color:#DC2626">−€48.27</div></div>
  <div class="row"><div class="ic" style="background:#16A34A">S</div>
    <div class="main"><div class="t">ACME GmbH Gehalt</div><div class="s">Salary · 01 Apr</div></div>
    <div class="amt" style="color:#16A34A">+€4,820.00</div></div>
  <div class="row"><div class="ic" style="background:#F59E0B">B</div>
    <div class="main"><div class="t">BVG Fahrkarte</div><div class="s">Transport · 20 Apr</div></div>
    <div class="amt" style="color:#DC2626">−€9.20</div></div>
</div></div></body></html>
