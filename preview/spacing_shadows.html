<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:var(--ml-font-sans)}
.wrap{padding:20px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center}
.r{background:#fff;border-radius:12px}
.demo-card{display:flex;align-items:center;justify-content:center;width:100%;height:52px;background:#fff;font-size:12px;color:var(--ml-muted)}
.r.xs{box-shadow:0 1px 2px rgba(15,23,42,.04)}
.r.sm{box-shadow:0 2px 8px rgba(15,23,42,.06)}
.r.md{box-shadow:0 8px 24px rgba(15,23,42,.10)}
.r.lg{box-shadow:0 16px 40px rgba(15,23,42,.14)}
.bg{background:#F1F5F9;padding:12px;border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.lbl{font-size:11px;color:var(--ml-muted);font-weight:600;text-align:center;margin-top:6px}
</style></head><body><div class="wrap">
<div class="bg">
  <div><div class="r xs demo-card">xs</div><div class="lbl">resting card</div></div>
  <div><div class="r sm demo-card">sm</div><div class="lbl">floating on navy</div></div>
  <div><div class="r md demo-card">md</div><div class="lbl">sheets · dialogs</div></div>
  <div><div class="r lg demo-card">lg</div><div class="lbl">modal</div></div>
</div></div></body></html>
