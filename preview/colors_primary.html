<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:var(--ml-font-sans);color:var(--ml-ink)}
.wrap{padding:20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;min-width:110px}
.chip{height:56px;border-radius:10px;border:1px solid rgba(15,23,42,.06)}
.lbl{font-size:12px;color:var(--ml-muted);font-weight:500}
.name{font-size:13px;color:var(--ml-ink);font-weight:600}
.hex{font-family:var(--ml-font-mono);font-size:11px;color:var(--ml-text)}
</style></head><body><div class="wrap">
<div class="row">
  <div class="sw"><div class="chip" style="background:#0F2A44"></div><div class="name">Navy</div><div class="hex">#0F2A44</div><div class="lbl">Header bg</div></div>
  <div class="sw"><div class="chip" style="background:#2563EB"></div><div class="name">Blue</div><div class="hex">#2563EB</div><div class="lbl">Accent / primary</div></div>
  <div class="sw"><div class="chip" style="background:#3B82F6"></div><div class="name">Blue light</div><div class="hex">#3B82F6</div><div class="lbl">Hover</div></div>
  <div class="sw"><div class="chip" style="background:#1D4ED8"></div><div class="name">Blue dark</div><div class="hex">#1D4ED8</div><div class="lbl">Press</div></div>
  <div class="sw"><div class="chip" style="background:#DBEAFE"></div><div class="name">Blue 50</div><div class="hex">#DBEAFE</div><div class="lbl">Container</div></div>
</div></div></body></html>
