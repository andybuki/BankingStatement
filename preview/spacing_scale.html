<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:var(--ml-font-sans)}
.wrap{padding:20px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:end}
.it{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{background:#2563EB}
.lbl{font-size:11px;color:var(--ml-muted);font-family:var(--ml-font-mono)}
.name{font-size:12px;color:var(--ml-ink);font-weight:600}
</style></head><body><div class="wrap">
<div class="it"><div class="box" style="width:4px;height:4px;border-radius:2px"></div><div class="name">s-1</div><div class="lbl">4px</div></div>
<div class="it"><div class="box" style="width:8px;height:8px;border-radius:2px"></div><div class="name">s-2</div><div class="lbl">8px</div></div>
<div class="it"><div class="box" style="width:12px;height:12px;border-radius:2px"></div><div class="name">s-3</div><div class="lbl">12px</div></div>
<div class="it"><div class="box" style="width:16px;height:16px;border-radius:3px"></div><div class="name">s-4</div><div class="lbl">16px</div></div>
<div class="it"><div class="box" style="width:24px;height:24px;border-radius:4px"></div><div class="name">s-6</div><div class="lbl">24px</div></div>
<div class="it"><div class="box" style="width:48px;height:48px;border-radius:6px"></div><div class="name">s-12</div><div class="lbl">48px</div></div>
</div></body></html>
