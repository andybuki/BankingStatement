<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:var(--ml-font-sans)}
.wrap{padding:20px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ml-muted);font-weight:600;width:70px}
</style></head><body><div class="wrap">
<div class="row"><div class="lbl">Primary</div>
  <button class="ml-btn">Import Statement</button>
  <button class="ml-btn" style="background:#3B82F6">Hover</button>
  <button class="ml-btn" style="background:#1D4ED8">Pressed</button>
  <button class="ml-btn" disabled>Disabled</button>
</div>
<div class="row"><div class="lbl">Ghost</div>
  <button class="ml-btn ml-btn--ghost">Manage accounts</button>
  <button class="ml-btn ml-btn--secondary">Cancel</button>
  <button class="ml-btn ml-btn--ghost" style="background:#DBEAFE">Selected</button>
</div>
<div class="row"><div class="lbl">Pills</div>
  <span class="ml-pill">Week</span>
  <span class="ml-pill" style="background:#2563EB;color:#fff">Month</span>
  <span class="ml-pill">Year</span>
  <span class="ml-pill">All</span>
  <span class="ml-pill">Custom</span>
</div>
</div></body></html>
